plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.serialization'
    id 'kotlin-kapt'
    id 'com.google.dagger.hilt.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}

def keystoreProps = new Properties()
def keystorePropsFile = rootProject.file('keystore.properties')
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def signingStoreFile = keystoreProps.getProperty('storeFile', localProps.getProperty('msm.release.storeFile'))
def signingStorePassword = keystoreProps.getProperty('storePassword', localProps.getProperty('msm.release.storePassword'))
def signingKeyAlias = keystoreProps.getProperty('keyAlias', localProps.getProperty('msm.release.keyAlias'))
def signingKeyPassword = keystoreProps.getProperty('keyPassword', localProps.getProperty('msm.release.keyPassword'))

android {
    namespace 'com.mystockmanager.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mystockmanager.app'
        minSdk 26
        targetSdk 36
        versionCode 28
        versionName '1.27'

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables {
            useSupportLibrary true
        }
        
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }
    }

    signingConfigs {
        release {
            if (signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                storeFile file(signingStoreFile)
                storePassword signingStorePassword
                keyAlias signingKeyAlias
                keyPassword signingKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            if (signingStoreFile && signingStorePassword && signingKeyAlias && signingKeyPassword) {
                signingConfig signingConfigs.release
            }
            
            ndk {
                debugSymbolLevel 'full'
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
    // Core Android & Kotlin
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.11.0'
    implementation 'androidx.activity:activity-compose:1.13.0'

    // Jetpack Compose (Material 3)
    implementation platform('androidx.compose:compose-bom:2026.08.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.navigation:navigation-compose:2.9.8'

    // Room Database
    def room_version = "2.8.4"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    kapt "androidx.room:room-compiler:$room_version"

    // Dagger Hilt (DI)
    implementation "com.google.dagger:hilt-android:2.60.1"
    kapt "com.google.dagger:hilt-compiler:2.60.1"
    implementation 'androidx.hilt:hilt-navigation-compose:1.4.0'

    // Coil (Image Loading)
    implementation 'io.coil-kt:coil-compose:2.7.0'

    // Networking (Ktor)
    implementation 'io.ktor:ktor-client-okhttp:3.5.2'
    implementation 'io.ktor:ktor-client-serialization:3.5.2'
    implementation 'io.ktor:ktor-client-logging:3.5.2'
    implementation 'io.ktor:ktor-client-websockets:3.5.2'
    implementation 'io.ktor:ktor-client-content-negotiation:3.5.2'
    implementation 'io.ktor:ktor-serialization-kotlinx-json:3.5.2'

    // Material Design
    implementation 'com.google.android.material:material:1.14.0'

    // AdMob
    implementation 'com.google.android.gms:play-services-ads:25.4.0'

    // QR Code Generation
    implementation 'com.google.zxing:core:3.5.4'

    // CameraX & ML Kit
    def camerax_version = "1.6.1"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation 'com.google.guava:guava:33.3.1-android'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // WorkManager for background tasks (notifications)
    implementation 'androidx.work:work-runtime-ktx:2.11.2'
    implementation 'androidx.hilt:hilt-work:1.4.0'
    kapt 'androidx.hilt:hilt-compiler:1.4.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:core:3.5.1'
    androidTestImplementation platform('androidx.compose:compose-bom:2026.08.00')
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-tooling'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'
}
